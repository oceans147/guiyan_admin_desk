# 轨眼设备管理系统 - GitLab CI
# 推送代码后在 GitLab 项目页 Build > Pipelines 查看构建,
# 任务成功后在任务的 Jobs > Artifacts 里下载各平台包。
#
# runner 说明(当前项目使用 shell executor 的 runner):
# - shell executor 会忽略下面的 image: 字段,任务直接跑在 runner 所在机器上
# - 因此 runner 机器必须预先装好 Flutter SDK 及 Linux 桌面构建依赖
#   (clang / cmake / ninja / pkg-config / libgtk-3-dev),且该系统须是 Linux
# - 若 runner 只接收带标签(tag)的任务,则本文件对应 job 必须写同名 tags,
#   否则任务会一直 pending(等待中)

stages:
  - build

variables:
  GIT_DEPTH: "1"

# ── Linux x86_64 包 ──────────────────────────────────────────────
# shell runner 直跑:先打印环境确认 flutter 可用,再构建、打包 bundle
build:linux:
  stage: build
  # tags:
  #   - <你的runner标签>   # 若 runner 设了「仅运行带标签任务」,取消本两行注释并填标签
  script:
    - flutter --version        # 确认 runner 机器上 Flutter 已装且在 PATH
    - flutter pub get
    - flutter build linux --release
    # bundle 是运行整个程序所需的目录(exe + lib/,打成一个 tar.gz)
    - tar -czf guiyan_admin_desk-linux-x64.tar.gz -C build/linux/x64/release bundle
  artifacts:
    name: "guiyan_admin_desk-linux"
    paths:
      - guiyan_admin_desk-linux-x64.tar.gz
    expire_in: 4 weeks

# ── Windows x64 包(需要自建 Windows docker executor runner)──────
# gitlab.com 官方 SaaS 不提供 Windows runner;若用 GitHub/其它有
# Windows runner 的实例,去掉 rules 即可启用
build:windows:
  stage: build
  tags:
    - windows
  rules:
    - when: manual   # 手动触发,避免没有 Windows runner 时阻塞流水线
  script:
    - flutter pub get
    - flutter build windows --release
    - pwsh -Command "Compress-Archive -Path 'build\windows\x64\runner\Release\*' -DestinationPath 'guiyan_admin_desk-windows-x64.zip' -Force"
  artifacts:
    name: "guiyan_admin_desk-windows"
    paths:
      - guiyan_admin_desk-windows-x64.zip
    expire_in: 4 weeks

# ── macOS 包(需要自建 macOS shell runner)───────────────────────
# macOS 无法用 docker,需在 Mac 上注册 shell executor runner;
# 产物是 .app,这里额外用 hdiutil 打成 dmg
build:macos:
  stage: build
  tags:
    - macos
  rules:
    - when: manual
  script:
    - flutter pub get
    - flutter build macos --release
    - rm -rf /tmp/dmg_stage && mkdir -p /tmp/dmg_stage
    - cp -R build/macos/Build/Products/Release/guiyan_admin_desk.app /tmp/dmg_stage/
    - ln -s /Applications /tmp/dmg_stage/Applications
    - hdiutil create -volname "guiyan_admin_desk" -srcfolder /tmp/dmg_stage -ov -format UDZO guiyan_admin_desk-macos.dmg
  artifacts:
    name: "guiyan_admin_desk-macos"
    paths:
      - guiyan_admin_desk-macos.dmg
    expire_in: 4 weeks
