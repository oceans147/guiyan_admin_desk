# 轨眼设备管理系统 - GitHub Actions 桌面打包
# 推送 main 或手动触发即可构建 Linux / Windows 安装包,
# 产物在 run 页面底部 "Artifacts" 区域下载。
name: build-desktop-packages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}   # 允许在 Actions 页面手动点“Run workflow”

# 与本机和之前 media_kit 验证过的版本对齐,避免漂移
env:
  FLUTTER_VERSION: "3.47.1"

jobs:
  # ── Linux x86_64:.deb 安装包 + 便携 tar.gz ──────────────────
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libmpv-dev mpv
          # libmpv-dev 提供 mpv.pc,media_kit_video 的 CMake 靠 pkg-config 找到 PkgConfig::mpv

      - name: Build
        run: |
          flutter config --enable-linux-desktop
          flutter pub get
          flutter build linux --release

      - name: Package portable tar.gz
        run: |
          tar -czf guiyan_admin_desk-linux-x64.tar.gz -C build/linux/x64/release bundle

      - name: Build .deb installer
        run: |
          set -e
          STAGE=deb_root
          APP=guiyan_admin_desk
          rm -rf "$STAGE"; mkdir -p \
            "$STAGE/opt/$APP" \
            "$STAGE/DEBIAN" \
            "$STAGE/usr/share/applications" \
            "$STAGE/usr/share/icons/hicolor/256x256/apps"
          # 程序本体(可执行文件 + lib/,Flutter 用 $ORIGIN rpath 定位,放 /opt 可直接跑)
          cp -r build/linux/x64/release/bundle/* "$STAGE/opt/$APP/"
          # 桌面图标
          if [ -f icon_1024.png ]; then
            cp icon_1024.png "$STAGE/usr/share/icons/hicolor/256x256/apps/$APP.png"
          fi
          # 菜单启动器
          cat > "$STAGE/usr/share/applications/$APP.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=轨眼设备管理系统
          Exec=/opt/$APP/$APP
          Icon=$APP
          Terminal=false
          Categories=Utility;
          EOF
          # 控制信息
          cat > "$STAGE/DEBIAN/control" <<EOF
          Package: guiyan-admin-desk
          Version: 1.0.0
          Architecture: amd64
          Maintainer: 轨眼 <admin@taiqiuai.cn>
          Depends: libmpv2, libgtk-3-0
          Description: 轨眼设备管理系统桌面客户端 (Flutter + mpv 播放 RTSP/RTMP)
          EOF
          dpkg-deb --build --root-owner-group "$STAGE" guiyan_admin_desk-linux-amd64.deb

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: guiyan_admin_desk-linux
          path: |
            guiyan_admin_desk-linux-x64.tar.gz
            guiyan_admin_desk-linux-amd64.deb
          if-no-files-found: error

  # ── Windows x64:Inno Setup 安装包 .exe ─────────────────────
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build windows --release

      - name: Locate Inno Setup compiler
        id: iscc
        shell: pwsh
        run: |
          $candidates = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "C:\Program Files\Inno Setup 6\ISCC.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Inno Setup (ISCC.exe) not found on runner" }
          "exe=$exe" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          $chinese = Join-Path (Split-Path $exe) "Languages\ChineseSimplified.isl"
          "hasChinese=$(Test-Path $chinese)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Compile installer .exe
        shell: pwsh
        run: |
          $exe = "${{ steps.iscc.outputs.exe }}"
          # 用参数数组,避免把空字符串当选项传给 ISCC(那会报 Unknown option)
          $isccArgs = @()
          if ("${{ steps.iscc.outputs.hasChinese }}" -eq "True") {
            $isccArgs += "/DCHINESE"
          }
          $isccArgs += "installer\guiyan_admin_desk.iss"
          Write-Host "Running: $exe $($isccArgs -join ' ')"
          & $exe @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "ISCC compile failed ($LASTEXITCODE)" }

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: guiyan_admin_desk-windows
          path: installer\Output\guiyan_admin_desk-setup.exe
          if-no-files-found: error
